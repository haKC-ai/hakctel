name: Firmware

on:
  # Not on every push to main. The pinned pioarduino platform self-upgrades the PlatformIO
  # core mid-build ("Please wait while upgrading PlatformIO..."), and the resulting
  # update_core_packages() reinstalls tool-scons 4.41101.0 over the 4.40801.0 the platform
  # validates against, which deletes the package and fails linking with
  # "ModuleNotFoundError: No module named 'SCons.Tool.FortranCommon'". Until that is fixed
  # upstream this job burns ~9 minutes per push to fail, so it runs on tags and on demand.
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The espressif32 platform builds its own penv and installs PlatformIO into it. If that
    # core is 6.2 it requests tool-scons 4.41101.0, overwriting the 4.40801.0 the platform
    # validates against, and the package is deleted mid-build. Constrain every resolver.
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
      UV_CONSTRAINT: ${{ github.workspace }}/constraints.txt
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Install SCons from the registry before the platform can pull its own copy. The
      # pioarduino zip ships a tools.json that sends the platform's install_tool() down
      # _install_with_idf_tools(), which deletes packages/tool-scons mid-build and breaks
      # linking with "No module named 'SCons.Tool.FortranCommon'".
      - run: pio pkg install -g -t "platformio/tool-scons@~4.40801.0"
      - run: python -m unittest tools/test_theme_tool.py
      - run: ./scripts/package_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hakctel-firmware
          path: dist/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
